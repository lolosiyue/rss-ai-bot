name: RSS AI Bot

on:
  # GitHub Actions 的 cron 沒有時區欄位，固定以 UTC 解讀。
  # 每日一次：23 16 * * * = UTC 16:23 = 東京 01:23 / 香港 00:23（都是翌日清晨）。
  # 這個鐘點在 DeepSeek 離峰。尖峰是北京時間週一至週五 09:00–12:00 與 14:00–18:00
  # （UTC 01:00–04:00 與 06:00–10:00），中國法定節假日整天與週末都不是尖峰。
  # 提早並錯開整點，是為了降低排程延遲滑進尖峰的機會。
  schedule:
    - cron: '23 16 * * *'
jobs:
  rss-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 最多執行 10 分鐘
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'  # 快取 pip 套件
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🤖 Run RSS Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python -u main.py
      
      - name: 📊 Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log
          retention-days: 7
